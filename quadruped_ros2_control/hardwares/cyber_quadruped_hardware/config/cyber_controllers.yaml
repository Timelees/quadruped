# 控制器配置文件
# 用于实机的 ocs2_quadruped_controller 配置

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz - 与实机 LCM 通信频率匹配

    # 控制器类型声明（必须在 controller_manager 命名空间下）
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ocs2_quadruped_controller:
      type: ocs2_quadruped_controller/Ocs2QuadrupedController

# 控制器特定参数（顶级节点）
ocs2_quadruped_controller:
  ros__parameters:
    update_rate: 500
    robot_pkg: "cyberdog_description"
    default_kd: 1.5
    default_kp: 70.0
    feet_force_threshold: 3.0
    # 关节名称配置 - 按照实机关节顺序
    # 顺序: FR(0-2), FL(3-5), RR(6-8), RL(9-11)
    joints:
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint

    # 命令接口
    command_interfaces:
      - effort
      - position
      - velocity
      - kp
      - kd

    # 状态接口
    state_interfaces:
      - effort
      - position
      - velocity

    feet:
      - FL_foot
      - FR_foot
      - RL_foot
      - RR_foot
    
    base_name: "base"

    # IMU 配置
    imu_name: "imu_sensor"
    imu_interfaces:
      - orientation.w
      - orientation.x
      - orientation.y
      - orientation.z
      - angular_velocity.x
      - angular_velocity.y
      - angular_velocity.z
      - linear_acceleration.x
      - linear_acceleration.y
      - linear_acceleration.z

    

    # 足端力传感器
    foot_force_name: "foot_force"
    foot_force_interfaces:
      - FL_foot_force
      - RL_foot_force
      - FR_foot_force
      - RR_foot_force

# joint_state_broadcaster 特定参数
joint_state_broadcaster:
  ros__parameters:
    joints:
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint

    interfaces:
      - position
      - velocity
      - effort
