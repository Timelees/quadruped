# Metres; z is snapped to the local support plane. Normal Cyberdog swing reference.
# Ground -> A -> B -> C -> D. Landings remain 25 mm inside each pillar's rear edge.
# Moving the first liftoff near A creates a reference edge collision without lowering swing height.
frame: odom
foot_radius: 0.019
map:
  length: [1.05, 0.7]
  center: [0.36, 0.0]
  resolution: 0.005
reference: {swing_height: 0.085, swing_time_scale: 0.20, lift_off_velocity: 0.04, touch_down_velocity: -0.04}
optimizer: {samples: 60, control_points: 15, clearance: 0.005, subdivisions: 4}
obstacles:
- [0.13, 0.23, -0.25, 0.25, 0.06]
- [0.31, 0.41, -0.25, 0.25, 0.06]
- [0.49, 0.59, -0.25, 0.25, 0.06]
- [0.67, 0.77, -0.25, 0.25, 0.06]
crossing_bands:
- [0.23, 0.31, -0.25, 0.25, 0.06]
- [0.41, 0.49, -0.25, 0.25, 0.06]
- [0.59, 0.67, -0.25, 0.25, 0.06]
swings:
- start: [0.105, 0.1, 0.0]
  goal: [0.205, 0.1, 0.0]
  duration: 0.3
- start: [0.205, 0.1, 0.0]
  goal: [0.385, 0.1, 0.0]
  duration: 0.3
- start: [0.385, 0.1, 0.0]
  goal: [0.565, 0.1, 0.0]
  duration: 0.3
- start: [0.565, 0.1, 0.0]
  goal: [0.745, 0.1, 0.0]
  duration: 0.3
visualization:
  height_range: [0.0, 0.30]
  colors: [[0, 0, 128], [0, 0, 255], [0, 128, 255], [0, 255, 255], [128, 255, 128], [255, 255, 0]]
