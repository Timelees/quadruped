# Controller Manager configuration
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    # Define the available controllers
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster


    ocs2_quadruped_controller:
      type: ocs2_quadruped_controller/Ocs2QuadrupedController

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: "imu_sensor"
    frame_id: "imu_link"
    

ocs2_quadruped_controller:
  ros__parameters:
    update_rate: 200  # Hz
    robot_pkg: "cyberdog_description"
    default_kd: 1.5
    feet_force_threshold: 3.0
    joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint


    command_interfaces:
      - effort
      - position
      - velocity
      - kp
      - kd

    state_interfaces:
      - effort
      - position
      - velocity

    feet:
      - FL_foot
      - FR_foot
      - RL_foot
      - RR_foot
    imu_name: "imu_sensor"
    base_name: "base"

    imu_interfaces:
      - orientation.w
      - orientation.x
      - orientation.y
      - orientation.z
      - angular_velocity.x
      - angular_velocity.y
      - angular_velocity.z
      - linear_acceleration.x
      - linear_acceleration.y
      - linear_acceleration.z
      - orientation_covariance.0
      - orientation_covariance.1
      - orientation_covariance.2
      - orientation_covariance.3
      - orientation_covariance.4
      - orientation_covariance.5
      - orientation_covariance.6
      - orientation_covariance.7
      - orientation_covariance.8
      - angular_velocity_covariance.0
      - angular_velocity_covariance.1
      - angular_velocity_covariance.2
      - angular_velocity_covariance.3
      - angular_velocity_covariance.4
      - angular_velocity_covariance.5
      - angular_velocity_covariance.6
      - angular_velocity_covariance.7
      - angular_velocity_covariance.8
      - linear_acceleration_covariance.0
      - linear_acceleration_covariance.1
      - linear_acceleration_covariance.2
      - linear_acceleration_covariance.3
      - linear_acceleration_covariance.4
      - linear_acceleration_covariance.5
      - linear_acceleration_covariance.6
      - linear_acceleration_covariance.7
      - linear_acceleration_covariance.8

      
    foot_force_name: "foot_force"
    foot_force_interfaces:
      - FL_foot_force
      - FR_foot_force
      - RL_foot_force
      - RR_foot_force

    # 状态估计器类型: error_state_kalman, linear_kalman, ground_truth
    estimator_type: "linear_kalman"

    # 是否启动感知 true: 感知运动  false: 盲走
    enable_perceptive: true
    planar_terrain_max_age: 1.0
    planar_terrain_future_tolerance: 0.2
    planar_terrain_center_jump_threshold: 0.6
    planar_terrain_center_filter_threshold: 0.05
    planar_terrain_height_filter_alpha: 0.5

    # 仿真/实机模式 true: 仿真  false: 实机
    sim_mode: true

    # Gazebo Ground Truth - 获取Gazebo中的真实位姿用于与状态估计对比
    gazebo_ground_truth: true
    odom_name: "ground_truth"
    odom_interfaces:
      - position.x
      - position.y
      - position.z
      - linear_velocity.x
      - linear_velocity.y
      - linear_velocity.z
      - orientation.x
      - orientation.y
      - orientation.z
      - orientation.w
      - angular_velocity.x
      - angular_velocity.y
      - angular_velocity.z
