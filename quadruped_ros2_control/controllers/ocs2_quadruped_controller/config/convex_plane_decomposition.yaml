convex_plane_decomposition_ros_node:
  ros__parameters:
    elevation_topic: '/elevation_map_raw'
    height_layer: 'elevation'
    target_frame_id: 'odom'
    submap:
      width: 3.0
      length: 3.0
    publish_to_controller: true
    frequency: 20.0

    preprocessing:
      resolution: 0.02    # Resampling resolution, set negative to skip, requires inpainting to be used
      kernelSize: 3       # Kernel size of the median filter, either 3 or 5
      numberOfRepeats: 1  # Number of times to apply the same filter
    
    sliding_window_plane_extractor:
      kernel_size: 3                                        # Size of the sliding window patch used for normal vector calculation and planarity detection. Should be an odd number and at least 3.
      planarity_opening_filter: 1                           # [#] Apply opening filter (erosion -> dilation) to planarity detection by this amount of pixels
      plane_inclination_threshold_degrees: 25.0             # [deg] 设置面片的法线向量与世界 z 轴之间的最大角度（以度为单位），以将其视为平面
      local_plane_inclination_threshold_degrees: 35.0       # [deg] 设置平面面片中各个单元格的最大角度（以度为单位）
      plane_patch_error_threshold: 0.05                     # [m] 指定要被视为平面的面片与拟合平面的最大均方根 （RMS） 偏差（以米为单位）
      min_number_points_per_label: 4                        # [#] 设置平面标签有效所需的最小点数。
      connectivity: 4                                       # Label kernel connectivity. 4 or 8 (cross or box)
      include_ransac_refinement: true                       # Enable RANSAC refinement if the plane is not globally fitting to the assigned points.
      global_plane_fit_distance_error_threshold: 0.05      # [m] 设置从一个点到拟合平面的最大距离（以米为单位），以将其视为平面的一部分
      global_plane_fit_angle_error_threshold_degrees: 20.0  # [deg] 设置点法线与平面法线之间的最大角度（以度为单位）

      enable_edge_detection: true                            # 通过表面法线不连续启用地形边缘检测
      edge_normal_dot_threshold_degrees: 30.0                # [deg] 设置相邻法线之间的角度阈值，以标记为地形边缘
    
    ransac_plane_refinement:
      probability: 0.0005      # Probability to miss the largest candidate shape. A lower probability provides a higher reliability and determinism at the cost of longer running times
      min_points: 6.0           # This minimum number of points per plane. Controls the termination of the algorithm.
      epsilon: 0.03         # Maximum distance to plane
      cluster_epsilon: 0.041  # [m] Set maximum Euclidean distance between points to be clustered. Two points are connected if separated by a distance of at most 2*sqrt(2)*cluster_epsilon = 2.828 * cluster_epsilon. Set this higher than resolution
      normal_threshold: 20.0  # [deg] Set maximum normal deviation between cluster surface_normal and point normal.
    
    contour_extraction:
      marginSize: 1    # Size of the kernel creating the boundary offset. In number of (sub) pixels.
    
    postprocessing:
      extracted_planes_height_offset: 0.0   # Added offset in Z direction for the full map to compensate for the location of the foot frame w.r.t. the contact point
      nonplanar_height_offset: 0.01       # 向高程图中的非平面像元添加高度偏移（以米为单位）。(提高边缘部分的高度，以避免非平面像元的高度过低)
      nonplanar_horizontal_offset: 0.0        # 向 XY 平面中的非平面单元添加水平偏移（以像素为单位）。
      smoothing_dilation_size: 0.3          # 设置在平滑高程图之前应用的膨胀核宽度的一半（以米为单位）。
      smoothing_box_kernel_size: 0.1        # 设置用于平滑高程图的框内核宽度（以米为单位）的一半。
      smoothing_gauss_kernel_size: 0.05     # 设置用于额外平滑的高斯核宽度（以米为单位）的一半。