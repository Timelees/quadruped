# Robot.
elevation_mapping:
  ros__parameters:
    map_frame_id: odom                      # 地图坐标系
    robot_base_frame_id: base               # 机器人基座坐标系
    robot_pose_with_covariance_topic: /pose # 机器人带协方差的位姿话题
    input_sources: ["depth_camera"]  # List of input sources to be used for elevation mapping.
    # input_sources
    depth_camera: # A name to identify the input source
      type: pointcloud # Supported types: pointcloud
      topic: /depth_camera/points
      queue_size: 1
      publish_on_update: true
      sensor_processor:
        type: perfect # Supported types: perfect, stereo, laser，structured_light
        # cutoff_min_depth: 0.2
        # cutoff_max_depth: 3.25
        # normal_factor_a: 0.000611
        # normal_factor_b:  0.003587
        # normal_factor_c: 0.3515
        # normal_factor_d: 0.0
        # normal_factor_e: 1.0
        # lateral_factor: 0.01576

        # 体素滤波 (会造成一些异常高度值)
        apply_voxelgrid_filter: false  # 是否应用体素滤波器
        voxelgrid_filter_size: 1e-9   # 体素边长，单位米   （过大会过滤很多）

        # 高度阈值滤波
        ignore_points_above: 2.5     # 高度上限，单位米
        ignore_points_below: -0.5     # 高度下限，单位米（相对于base高度）

        # 空间盒子滤波
        ignore_points_inside_min_x: -0.35  
        ignore_points_inside_max_x: 0.35
        ignore_points_inside_min_y: -0.35  
        ignore_points_inside_max_y: 0.35
        ignore_points_inside_min_z: -0.35  
        ignore_points_inside_max_z: 0.35

    # lidar:
    #   type: pointcloud
    #   topic: /scan/points
    #   queue_size: 1
    #   publish_on_update: true
    #   sensor_processor:
    #     type: laser
    #   ignore_points_above: 0.5
    #   ignore_points_below: -0.5

    # 地图跟随
    track_point_frame_id: base      # 高程图跟随的点的坐标系
    track_point_x: 0.0
    track_point_y: 0.0
    track_point_z: 0.0
    time_tolerance: 0.001        # 允许用略早于最后更新时间的数据做更新。
    robot_pose_cache_size: 300  # 缓存机器人位姿的缓存大小
    scanning_duration: 0.1
    visibility_cleanup_rate: 5.0  # 控制可见性清理线程多久运行一次

    # Map.
    length_in_x: 3.0
    length_in_y: 3.0
    position_x: 0.0
    position_y: 0.0
    resolution: 0.01

    mahalanobis_distance_threshold: 2.5

    # 方差限制
    min_variance: 0.0001
    max_variance: 0.05
    horizontal_variance_x: 0.5       # 水平方差在x方向上的值
    horizontal_variance_y: 0.0001      # 水平方差在y方向上的值
    # min_horizontal_variance: 0.000225  # pow(resolution / 2.0 , 2)
    max_horizontal_variance: 0.005

    multi_height_noise: 0.001       # 多高度噪声
    
    surface_normal_positive_axis: z
    
    # Settings for initializing elevation map
    initialize_elevation_map: true
    initialization_method: 0
    length_in_x_init_submap: 3.0
    length_in_y_init_submap: 3.0
    margin_init_submap: 0.0
    init_submap_variance: 1e-3
    init_submap_height_offset: 0.0   # 高程图初始化子图的高度偏移（以米为单位）
    fuse_submap_height_offset: 0.0365   # 融合子图时的高度偏移（以米为单位）——弥补点云的高度偏移
    elevation_clamp_threshold: 0.01    # 点云融合后高程绝对值小于此阈值则钳位为0（抑制地面附近的点云噪声）
    target_frame_init_submap: odom    # 初始化子图的目标坐标系
    increase_height_alpha: 0.0        # 当新观测高度高于当前地图高度时，增加高度的权重，alpha越大越倾向于增加高度

    enable_visibility_cleanup: true       # 开关可见性清理
    enable_continuous_cleanup: false      # 每来一帧点云先 clear map，再只保留最新观测
    
    num_callback_threads: 2 # 处理点云回调的线程数
    postprocessor_num_threads: 8 # 处理点云后处理的线程数
    # fused_map_publishing_rate: 1.0  # 发布整个（融合的）高程地图的速率 
  